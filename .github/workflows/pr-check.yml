name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check repository baseline
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "${BASE_SHA}" ]]; then
            ./scripts/check-repo.sh --base-ref "${BASE_SHA}"
          else
            ./scripts/check-repo.sh
          fi

  checker-tests:
    name: Repository Checker Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test repository checker
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py"

  m0-core-contracts:
    name: M0 Core Contracts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: radishnexus_m0_test
          POSTGRES_USER: radishnexus_test
          POSTGRES_PASSWORD: radishnexus-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radishnexus_test -d radishnexus_m0_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: experiments/m0-core-contracts/go.mod
          cache-dependency-path: experiments/m0-core-contracts/go.sum

      - name: Check Go contract experiment
        run: ./scripts/check-m0-core-contracts.sh

      - name: Test PostgreSQL contract experiment
        working-directory: experiments/m0-core-contracts
        env:
          DATABASE_URL: postgres://radishnexus_test:radishnexus-test-only@127.0.0.1:5432/radishnexus_m0_test?sslmode=disable
        run: go test -tags=integration ./...

  go-server:
    name: Go Server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: radishnexus_server_test
          POSTGRES_USER: radishnexus_test
          POSTGRES_PASSWORD: radishnexus-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radishnexus_test -d radishnexus_server_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check Go server
        run: ./scripts/check-server.sh

      - name: Test PostgreSQL Golden Path slice
        working-directory: server
        env:
          DATABASE_URL: postgres://radishnexus_test:radishnexus-test-only@127.0.0.1:5432/radishnexus_server_test?sslmode=disable
        run: go test -tags=integration ./...

  candidate-quality:
    name: Candidate Quality
    runs-on: ubuntu-latest
    if: always()
    needs:
      - repo-hygiene
      - checker-tests
      - m0-core-contracts
      - go-server

    steps:
      - name: Summarize candidate quality
        shell: bash
        env:
          REPO_HYGIENE_RESULT: ${{ needs.repo-hygiene.result }}
          CHECKER_TESTS_RESULT: ${{ needs.checker-tests.result }}
          M0_CORE_CONTRACTS_RESULT: ${{ needs.m0-core-contracts.result }}
          GO_SERVER_RESULT: ${{ needs.go-server.result }}
        run: |
          {
            echo "## Candidate Quality"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Repo Hygiene | ${REPO_HYGIENE_RESULT} |"
            echo "| Repository Checker Tests | ${CHECKER_TESTS_RESULT} |"
            echo "| M0 Core Contracts | ${M0_CORE_CONTRACTS_RESULT} |"
            echo "| Go Server | ${GO_SERVER_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${REPO_HYGIENE_RESULT}" != "success" || "${CHECKER_TESTS_RESULT}" != "success" || "${M0_CORE_CONTRACTS_RESULT}" != "success" || "${GO_SERVER_RESULT}" != "success" ]]; then
            echo "Candidate quality checks did not all succeed." >&2
            exit 1
          fi

          echo "All candidate quality components succeeded."
