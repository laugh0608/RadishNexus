name: radishnexus-jenkins-lab
services:
  controller:
    image: jenkins/jenkins:2.568.3-jdk21@sha256:c1e4c349365f6d16d88595b2c5f7e8ff39b8ae1d061f62420bac193b4b9616d0
    pull_policy: never
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xmx768m
    ports:
      - 127.0.0.1:18080:8080
    volumes:
      - ./data/jenkins_home:/var/jenkins_home
      - ./bootstrap.groovy:/usr/share/jenkins/ref/init.groovy.d/nexus-lab.groovy:ro
    networks: [lab]
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
  agent:
    image: jenkins/inbound-agent@sha256:6a31d728c22ad74adbb6b9a1a210eb9ec2599f644b95edd7f8a3b8a71d20772c
    pull_policy: never
    entrypoint: [sh, /lab/agent.sh]
    volumes:
      - ./agent.sh:/lab/agent.sh:ro
      - ./Agent.java:/lab/Agent.java:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /home/jenkins/agent:size=128m,uid=1000,gid=1000,mode=0700
    read_only: true
    networks: [lab]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
networks:
  lab:
    internal: true
